<svg xmlns="http://www.w3.org/2000/svg" class="aios-diagram" width="1080" height="922" viewBox="0 0 1080 922" role="img" aria-labelledby="engf1-title engf1-desc">
<title id="engf1-title">What closes the feedback loop?</title>
<desc id="engf1-desc">Two proposed feedback workflows are shown side by side. Visual exploration cycles through a reference, generated prototype and appearance review. Engineered delivery connects a problem and success criteria to inspected evidence, a bounded brief, reviewed plan, thin implementation and verification of behavior and recovery. Verification can return to the assumptions; the diagram does not assert that all informal prototyping is bad.</desc>
<defs><marker id="engf1-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/></marker></defs>
<style>
  .aios-diagram .paper { fill:#fff; }
  .aios-diagram .line { fill:none; stroke:#111; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .aios-diagram .quiet { fill:none; stroke:#777; stroke-width:1.1; stroke-linecap:round; stroke-linejoin:round; }
  .aios-diagram .dash { stroke-dasharray:5 6; }
  .aios-diagram .node { fill:#fff; stroke:#111; stroke-width:1.6; }
  .aios-diagram .frame { fill:#fff; stroke:#777; stroke-width:1.1; }
  .aios-diagram text { fill:#111; font-family:LatinModern,'Latin Modern Roman','Liberation Serif','Times New Roman',serif; }
  .aios-diagram .title { font-size:34px; }
  .aios-diagram .subtitle { font-size:18px; fill:#555; letter-spacing:.7px; }
  .aios-diagram .label { font-size:26px; }
  .aios-diagram .body { font-size:24px; }
  .aios-diagram .small { font-size:21px; fill:#333; }
  .aios-diagram .meta { font-size:18px; fill:#555; letter-spacing:.6px; }
  .aios-diagram .rule { stroke:#111; stroke-width:1.2; }
  .aios-diagram .motion { pointer-events:none; }
  @media (prefers-reduced-motion: reduce) { .aios-diagram .motion { display:none; } }
</style>
<rect width="1080" height="922" class="paper"/>
<text x="60" y="53" class="title" text-anchor="start" ><tspan x="60" dy="0">What closes the feedback loop?</tspan></text><text x="60" y="90" class="subtitle" text-anchor="start" ><tspan x="60" dy="0">FIGURE 1  /  CONCEPTUAL WORKFLOWS</tspan></text><line x1="60" y1="111" x2="1020" y2="111" class="rule"/><rect x="60" y="151" width="445" height="654" rx="3" class="frame"/><rect x="575" y="151" width="445" height="654" rx="3" class="frame"/><text x="283" y="191" class="meta" text-anchor="middle" ><tspan x="283" dy="0">VISUAL EXPLORATION</tspan></text><text x="283" y="220" class="small" text-anchor="middle" ><tspan x="283" dy="0">Useful for discovering appearance</tspan></text><text x="798" y="191" class="meta" text-anchor="middle" ><tspan x="798" dy="0">ENGINEERED DELIVERY</tspan></text><text x="798" y="220" class="small" text-anchor="middle" ><tspan x="798" dy="0">Useful for dependable operation</tspan></text><rect x="145" y="255" width="330" height="90" rx="2" class="node"/><text x="310.0" y="293.5" class="label" text-anchor="middle" ><tspan x="310.0" dy="0">Screenshot or</tspan><tspan x="310.0" dy="29">visual reference</tspan></text><rect x="145" y="425" width="330" height="90" rx="2" class="node"/><text x="310.0" y="463.5" class="label" text-anchor="middle" ><tspan x="310.0" dy="0">Generate a</tspan><tspan x="310.0" dy="29">working prototype</tspan></text><rect x="145" y="595" width="330" height="90" rx="2" class="node"/><text x="310.0" y="633.5" class="label" text-anchor="middle" ><tspan x="310.0" dy="0">Inspect appearance</tspan><tspan x="310.0" dy="29">and revise</tspan></text><path d="M 310 345 V 425" class="line" marker-end="url(#engf1-arrow)"/><path d="M 310 515 V 595" class="line" marker-end="url(#engf1-arrow)"/><path d="M 310 685 V 751 H 104 V 300 H 145" class="line" marker-end="url(#engf1-arrow)"/><text x="306" y="783" class="small" text-anchor="middle" ><tspan x="306" dy="0">A valid loop for visual hypotheses</tspan></text><rect x="636" y="242" width="345" height="65" rx="2" class="node"/><text x="808.5" y="282.5" class="body" text-anchor="middle" ><tspan x="808.5" dy="0">Problem + success criteria</tspan></text><rect x="636" y="332" width="345" height="65" rx="2" class="node"/><text x="808.5" y="372.5" class="body" text-anchor="middle" ><tspan x="808.5" dy="0">Inspect code + evidence</tspan></text><rect x="636" y="422" width="345" height="65" rx="2" class="node"/><text x="808.5" y="462.5" class="body" text-anchor="middle" ><tspan x="808.5" dy="0">Bounded implementation brief</tspan></text><rect x="636" y="512" width="345" height="65" rx="2" class="node"/><text x="808.5" y="552.5" class="body" text-anchor="middle" ><tspan x="808.5" dy="0">Review plan + alternatives</tspan></text><rect x="636" y="602" width="345" height="65" rx="2" class="node"/><text x="808.5" y="642.5" class="body" text-anchor="middle" ><tspan x="808.5" dy="0">Implement a thin slice</tspan></text><rect x="636" y="692" width="345" height="65" rx="2" class="node"/><text x="808.5" y="732.5" class="body" text-anchor="middle" ><tspan x="808.5" dy="0">Verify behavior + recovery</tspan></text><path d="M 808.5 307 V 332" class="line" marker-end="url(#engf1-arrow)"/><path d="M 808.5 397 V 422" class="line" marker-end="url(#engf1-arrow)"/><path d="M 808.5 487 V 512" class="line" marker-end="url(#engf1-arrow)"/><path d="M 808.5 577 V 602" class="line" marker-end="url(#engf1-arrow)"/><path d="M 808.5 667 V 692" class="line" marker-end="url(#engf1-arrow)"/><path d="M 808.5 757 V 785 H 602 V 274.5 H 636" class="line" marker-end="url(#engf1-arrow)"/><text x="60" y="854" class="body" text-anchor="start" ><tspan x="60" dy="0">The loops can coexist. Their feedback tests different properties.</tspan></text><text x="60" y="887" class="small" text-anchor="start" ><tspan x="60" dy="0">Behavioral evidence can revise the original assumptions, brief or plan.</tspan></text><g class="motion" aria-hidden="true"><circle r="3.8" fill="#111"><animateMotion dur="7s" begin="0s" repeatCount="indefinite" path="M 310 345 V 425"/></circle></g><g class="motion" aria-hidden="true"><circle r="3.2" fill="#111"><animateMotion dur="14s" begin="2s" repeatCount="indefinite" path="M 310 685 V 751 H 104 V 300 H 145"/></circle></g><g class="motion" aria-hidden="true"><circle r="3.8" fill="#111"><animateMotion dur="8s" begin="1s" repeatCount="indefinite" path="M 808.5 667 V 692"/></circle></g><g class="motion" aria-hidden="true"><circle r="3.2" fill="#111"><animateMotion dur="16s" begin="3s" repeatCount="indefinite" path="M 808.5 757 V 785 H 602 V 274.5 H 636"/></circle></g>
</svg>