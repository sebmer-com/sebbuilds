<svg xmlns="http://www.w3.org/2000/svg" class="aios-diagram" width="1080" height="940" viewBox="0 0 1080 940" role="img" aria-labelledby="engf3-title engf3-desc">
<title id="engf3-title">A retry should recover an operation</title>
<desc id="engf3-desc">A proposed deployment state machine shows requested to provisioning, followed by ready or failed. A separate response-handling path distinguishes a lost response from a new business operation. The client looks up or reconciles the stable operation ID against durable state and returns its status or continues reconciliation. The intended invariant is that a retry must not duplicate a requested resource or its initial charge; a deployment may legitimately request several resources. Atomic deduplication, durable state and external provider reconciliation must implement the intended behavior. The figure does not claim a universal exactly-once guarantee or that any existing product has these guarantees.</desc>
<defs><marker id="engf3-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/></marker></defs>
<style>
