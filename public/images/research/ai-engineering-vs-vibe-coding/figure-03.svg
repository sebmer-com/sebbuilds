<rect width="1080" height="940" class="paper"/>
<text x="60" y="53" class="title" text-anchor="start" ><tspan x="60" dy="0">A retry should recover an operation</tspan></text><text x="60" y="90" class="subtitle" text-anchor="start" ><tspan x="60" dy="0">FIGURE 3  /  PROPOSED API SEMANTICS</tspan></text><line x1="60" y1="111" x2="1020" y2="111" class="rule"/><rect x="60" y="151" width="960" height="351" class="frame"/><text x="540" y="187" class="meta" text-anchor="middle" ><tspan x="540" dy="0">DURABLE OPERATION RECORD · STABLE OPERATION ID</tspan></text><rect x="90" y="231" width="220" height="87" rx="2" class="node"/><text x="200.0" y="282.5" class="label" text-anchor="middle" ><tspan x="200.0" dy="0">Requested</tspan></text><rect x="395" y="231" width="280" height="87" rx="2" class="node"/><text x="535.0" y="282.5" class="label" text-anchor="middle" ><tspan x="535.0" dy="0">Provisioning</tspan></text><rect x="795" y="231" width="195" height="87" rx="2" class="node"/><text x="892.5" y="282.5" class="label" text-anchor="middle" ><tspan x="892.5" dy="0">Ready</tspan></text><rect x="395" y="391" width="280" height="76" rx="2" class="node"/><text x="535.0" y="437.0" class="label" text-anchor="middle" ><tspan x="535.0" dy="0">Failed</tspan></text><path d="M 310 274.5 H 395" class="line" marker-end="url(#engf3-arrow)"/><path d="M 675 274.5 H 795" class="line" marker-end="url(#engf3-arrow)"/><path d="M 535 318 V 391" class="line" marker-end="url(#engf3-arrow)"/><text x="735" y="256" class="small" text-anchor="middle" ><tspan x="735" dy="0">succeeds</tspan></text><text x="555" y="362" class="small" text-anchor="start" ><tspan x="555" dy="0">fails</tspan></text><text x="60" y="549" class="meta" text-anchor="start" ><tspan x="60" dy="0">RESPONSE HANDLING · RECOVER THE SAME OPERATION</tspan></text><rect x="60" y="600" width="270" height="100" rx="2" class="node"/><text x="195.0" y="643.5" class="body" text-anchor="middle" ><tspan x="195.0" dy="0">Response lost;</tspan><tspan x="195.0" dy="29">outcome unknown</tspan></text><rect x="410" y="600" width="280" height="100" rx="2" class="node"/><text x="550.0" y="643.5" class="body" text-anchor="middle" ><tspan x="550.0" dy="0">Read status / reconcile</tspan><tspan x="550.0" dy="29">the same operation ID</tspan></text><rect x="770" y="600" width="250" height="100" rx="2" class="node"/><text x="895.0" y="643.5" class="body" text-anchor="middle" ><tspan x="895.0" dy="0">Return current status</tspan><tspan x="895.0" dy="29">or reconcile further</tspan></text><path d="M 330 650 H 410" class="line" marker-end="url(#engf3-arrow)"/><path d="M 690 650 H 770" class="line" marker-end="url(#engf3-arrow)"/><path d="M 550 600 V 563 H 1000 V 502" class="line" marker-end="url(#engf3-arrow)"/><text x="755" y="584" class="small" text-anchor="start" ><tspan x="755" dy="0">look up; do not recreate</tspan></text><rect x="60" y="752" width="960" height="152" class="node"/><text x="540" y="784" class="meta" text-anchor="middle" ><tspan x="540" dy="0">INVARIANTS TO IMPLEMENT AND TEST</tspan></text><text x="540" y="820" class="body" text-anchor="middle" ><tspan x="540" dy="0">A retry must not duplicate a requested resource or its initial charge.</tspan></text><text x="540" y="855" class="small" text-anchor="middle" ><tspan x="540" dy="0">Requires atomic deduplication, durable state and provider reconciliation.</tspan><tspan x="540" dy="28">An operation ID alone does not guarantee exactly-once effects.</tspan></text><g class="motion" aria-hidden="true"><circle r="3.8" fill="#111"><animateMotion dur="7s" begin="0s" repeatCount="indefinite" path="M 310 274.5 H 395"/></circle></g><g class="motion" aria-hidden="true"><circle r="3.8" fill="#111"><animateMotion dur="8s" begin="2s" repeatCount="indefinite" path="M 675 274.5 H 795"/></circle></g><g class="motion" aria-hidden="true"><circle r="3.8" fill="#111"><animateMotion dur="8s" begin="1s" repeatCount="indefinite" path="M 330 650 H 410"/></circle></g><g class="motion" aria-hidden="true"><circle r="3.2" fill="#111"><animateMotion dur="10s" begin="3s" repeatCount="indefinite" path="M 550 600 V 563 H 1000 V 502"/></circle></g>
</svg>