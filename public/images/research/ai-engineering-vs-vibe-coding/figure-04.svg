<svg xmlns="http://www.w3.org/2000/svg" class="aios-diagram" width="1080" height="1014" viewBox="0 0 1080 1014" role="img" aria-labelledby="engf4-title engf4-desc">
<title id="engf4-title">A development graph that can stop</title>
<desc id="engf4-desc">The proposed control flow begins with durable task state containing the goal, constraints, evidence, decisions, patch and verification results. Research and planning lead to a thin implementation, behavioral verification and review against acceptance criteria. Review loops back only when change is needed and iteration budget remains; accepted work can be integrated, while exhausted limits or unresolved uncertainty stop the run for a scope decision. All roles are logical functions and may be performed by the same agent.</desc>
<defs><marker id="engf4-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/></marker></defs>
<style>
  .aios-diagram .paper { fill:#fff; }
  .aios-diagram .line { fill:none; stroke:#111; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .aios-diagram .quiet { fill:none; stroke:#777; stroke-width:1.1; stroke-linecap:round; stroke-linejoin:round; }
  .aios-diagram .dash { stroke-dasharray:5 6; }
  .aios-diagram .node { fill:#fff; stroke:#111; stroke-width:1.6; }
  .aios-diagram .frame { fill:#fff; stroke:#777; stroke-width:1.1; }
  .aios-diagram text { fill:#111; font-family:LatinModern,'Latin Modern Roman','Liberation Serif','Times New Roman',serif; }
  .aios-diagram .title { font-size:34px; }
  .aios-diagram .subtitle { font-size:18px; fill:#555; letter-spacing:.7px; }
  .aios-diagram .label { font-size:26px; }
  .aios-diagram .body { font-size:24px; }
  .aios-diagram .small { font-size:21px; fill:#333; }
  .aios-diagram .meta { font-size:18px; fill:#555; letter-spacing:.6px; }
  .aios-diagram .rule { stroke:#111; stroke-width:1.2; }
  .aios-diagram .motion { pointer-events:none; }
  @media (prefers-reduced-motion: reduce) { .aios-diagram .motion { display:none; } }
</style>
<rect width="1080" height="1014" class="paper"/>
<text x="60" y="53" class="title" text-anchor="start" ><tspan x="60" dy="0">A development graph that can stop</tspan></text><text x="60" y="90" class="subtitle" text-anchor="start" ><tspan x="60" dy="0">FIGURE 4  /  PROPOSED CONTROL FLOW</tspan></text><line x1="60" y1="111" x2="1020" y2="111" class="rule"/><rect x="60" y="151" width="960" height="119" class="frame"/><text x="540" y="187" class="meta" text-anchor="middle" ><tspan x="540" dy="0">DURABLE TASK STATE</tspan></text><text x="540" y="222" class="small" text-anchor="middle" ><tspan x="540" dy="0">Goal · constraints · evidence · decisions · patch · verification results</tspan></text><text x="540" y="252" class="small" text-anchor="middle" ><tspan x="540" dy="0">Each step reads and records this state.</tspan></text><path d="M 265 270 V 332" class="line" marker-end="url(#engf4-arrow)"/><rect x="60" y="332" width="410" height="100" rx="2" class="node"/><text x="265.0" y="375.5" class="label" text-anchor="middle" ><tspan x="265.0" dy="0">Research + plan</tspan><tspan x="265.0" dy="29">Resolve material uncertainty</tspan></text><rect x="610" y="332" width="410" height="100" rx="2" class="node"/><text x="815.0" y="375.5" class="label" text-anchor="middle" ><tspan x="815.0" dy="0">Implement a thin change</tspan><tspan x="815.0" dy="29">Stay within the brief</tspan></text><rect x="610" y="532" width="410" height="100" rx="2" class="node"/><text x="815.0" y="575.5" class="label" text-anchor="middle" ><tspan x="815.0" dy="0">Verify behavior</tspan><tspan x="815.0" dy="29">Exercise relevant failure paths</tspan></text><rect x="60" y="532" width="410" height="100" rx="2" class="node"/><text x="265.0" y="575.5" class="label" text-anchor="middle" ><tspan x="265.0" dy="0">Review against</tspan><tspan x="265.0" dy="29">acceptance criteria</tspan></text><path d="M 470 382 H 610" class="line" marker-end="url(#engf4-arrow)"/><path d="M 815 432 V 532" class="line" marker-end="url(#engf4-arrow)"/><path d="M 610 582 H 470" class="line" marker-end="url(#engf4-arrow)"/><path d="M 265 532 V 432" class="line" marker-end="url(#engf4-arrow)"/><text x="286" y="475" class="small" text-anchor="start" ><tspan x="286" dy="0">change; iteration</tspan><tspan x="286" dy="26">budget remains</tspan></text><path d="M 170 632 V 801" class="line" marker-end="url(#engf4-arrow)"/><path d="M 365 632 V 729 H 815 V 801" class="line" marker-end="url(#engf4-arrow)"/><text x="150" y="729" class="small" text-anchor="end" ><tspan x="150" dy="0">accept</tspan></text><text x="680" y="694" class="small" text-anchor="middle" ><tspan x="680" dy="0">limit reached or</tspan><tspan x="680" dy="26">unresolved uncertainty</tspan></text><rect x="60" y="801" width="410" height="94" rx="2" class="node"/><text x="265.0" y="856.0" class="label" text-anchor="middle" ><tspan x="265.0" dy="0">Integrate the accepted change</tspan></text><rect x="610" y="801" width="410" height="94" rx="2" class="node"/><text x="815.0" y="856.0" class="label" text-anchor="middle" ><tspan x="815.0" dy="0">Stop and revise the scope</tspan></text><text x="60" y="942" class="small" text-anchor="start" ><tspan x="60" dy="0">These are logical functions: one agent or several workers may perform them.</tspan></text><text x="60" y="975" class="small" text-anchor="start" ><tspan x="60" dy="0">Iteration limits and acceptance criteria belong in the control flow.</tspan></text><g class="motion" aria-hidden="true"><circle r="3.8" fill="#111"><animateMotion dur="8s" begin="0s" repeatCount="indefinite" path="M 470 382 H 610"/></circle></g><g class="motion" aria-hidden="true"><circle r="3.8" fill="#111"><animateMotion dur="8s" begin="2s" repeatCount="indefinite" path="M 610 582 H 470"/></circle></g><g class="motion" aria-hidden="true"><circle r="3.2" fill="#111"><animateMotion dur="10s" begin="3s" repeatCount="indefinite" path="M 265 532 V 432"/></circle></g><g class="motion" aria-hidden="true"><circle r="3.2" fill="#111"><animateMotion dur="12s" begin="5s" repeatCount="indefinite" path="M 170 632 V 801"/></circle></g>
</svg>