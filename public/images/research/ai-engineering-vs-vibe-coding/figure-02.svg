<svg xmlns="http://www.w3.org/2000/svg" class="aios-diagram" width="1080" height="930" viewBox="0 0 1080 930" role="img" aria-labelledby="engf2-title engf2-desc">
<title id="engf2-title">Make the plan traceable to the need</title>
<desc id="engf2-desc">Illustrative decision record. The need for low idle cost and no virtual-machine administration leads to investigating managed PostgreSQL, serverless execution and an email service API. A cheap VM is rejected for this particular constraint. Managed APIs remain a candidate pending inspection of pricing, limits, failure behavior, contracts and remaining operational work. Acceptance checks cover idle cost, retry semantics and no required VM upkeep. User-to-deployment ownership is a minimal proposed model; no actual provider or Oh MyHost architecture is asserted.</desc>
<defs><marker id="engf2-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/></marker></defs>
