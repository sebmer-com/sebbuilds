</style>
<rect width="1080" height="930" class="paper"/>
<text x="60" y="53" class="title" text-anchor="start" ><tspan x="60" dy="0">Make the plan traceable to the need</tspan></text><text x="60" y="90" class="subtitle" text-anchor="start" ><tspan x="60" dy="0">FIGURE 2  /  ILLUSTRATIVE DECISION RECORD</tspan></text><line x1="60" y1="111" x2="1020" y2="111" class="rule"/><rect x="60" y="151" width="960" height="87" rx="2" class="node"/><text x="540.0" y="202.5" class="label" text-anchor="middle" ><tspan x="540.0" dy="0">User need: low idle cost; no VM administration</tspan></text><path d="M 540 238 V 266 H 200 V 315" class="line" marker-end="url(#engf2-arrow)"/><path d="M 540 266 V 315" class="line" marker-end="url(#engf2-arrow)"/><path d="M 540 266 H 880 V 315" class="line" marker-end="url(#engf2-arrow)"/><rect x="280" y="273" width="520" height="27" fill="#fff"/><text x="540" y="292" class="small" text-anchor="middle" ><tspan x="540" dy="0">Candidate capabilities to investigate</tspan></text><rect x="60" y="315" width="280" height="82" rx="2" class="node"/><text x="200.0" y="364.0" class="body" text-anchor="middle" ><tspan x="200.0" dy="0">Managed PostgreSQL</tspan></text><rect x="400" y="315" width="280" height="82" rx="2" class="node"/><text x="540.0" y="364.0" class="body" text-anchor="middle" ><tspan x="540.0" dy="0">Serverless execution</tspan></text><rect x="740" y="315" width="280" height="82" rx="2" class="node"/><text x="880.0" y="364.0" class="body" text-anchor="middle" ><tspan x="880.0" dy="0">Email service API</tspan></text><path d="M 200 397 V 420 H 880 V 443" class="quiet"/><path d="M 540 397 V 443" class="line" marker-end="url(#engf2-arrow)"/><path d="M 880 397 V 420" class="quiet"/><rect x="60" y="443" width="960" height="133" class="node"/><line x1="540" y1="459" x2="540" y2="560" class="quiet"/><text x="300" y="475" class="body" text-anchor="middle" ><tspan x="300" dy="0">Cheap self-managed VM: reject</tspan></text><text x="300" y="512" class="small" text-anchor="middle" ><tspan x="300" dy="0">Low price does not satisfy the</tspan><tspan x="300" dy="27">no-VM-administration constraint.</tspan></text><text x="780" y="475" class="body" text-anchor="middle" ><tspan x="780" dy="0">Managed APIs: candidate</tspan></text><text x="780" y="512" class="small" text-anchor="middle" ><tspan x="780" dy="0">Check the operational constraints;</tspan><tspan x="780" dy="27">the label alone proves little.</tspan></text><path d="M 300 576 V 641" class="line" marker-end="url(#engf2-arrow)"/><path d="M 780 576 V 641" class="line" marker-end="url(#engf2-arrow)"/><rect x="170" y="594" width="260" height="29" fill="#fff"/><rect x="630" y="594" width="300" height="29" fill="#fff"/><text x="300" y="615" class="small" text-anchor="middle" ><tspan x="300" dy="0">decision evidence</tspan></text><text x="780" y="615" class="small" text-anchor="middle" ><tspan x="780" dy="0">acceptance evidence</tspan></text><rect x="60" y="641" width="445" height="146" class="frame"/><rect x="575" y="641" width="445" height="146" class="frame"/><text x="283" y="675" class="body" text-anchor="middle" ><tspan x="283" dy="0">Inspect before committing</tspan></text><text x="283" y="711" class="small" text-anchor="middle" ><tspan x="283" dy="0">Pricing at the expected workload</tspan><tspan x="283" dy="27">Limits, failure behavior and contracts</tspan><tspan x="283" dy="27">Operational work still owned by us</tspan></text><text x="798" y="675" class="body" text-anchor="middle" ><tspan x="798" dy="0">Verify the promised behavior</tspan></text><text x="798" y="711" class="small" text-anchor="middle" ><tspan x="798" dy="0">Idle workload stays within budget</tspan><tspan x="798" dy="27">Retries preserve one logical operation</tspan><tspan x="798" dy="27">Required tasks need no VM upkeep</tspan></text><line x1="60" y1="824" x2="1020" y2="824" class="rule"/><text x="60" y="858" class="body" text-anchor="start" ><tspan x="60" dy="0">Minimal ownership model: user → deployment</tspan></text><text x="60" y="894" class="small" text-anchor="start" ><tspan x="60" dy="0">Organization hierarchy: deferred until a concrete requirement justifies it.</tspan></text><g class="motion" aria-hidden="true"><circle r="3.8" fill="#111"><animateMotion dur="9s" begin="0s" repeatCount="indefinite" path="M 540 238 V 266 H 880 V 315"/></circle></g><g class="motion" aria-hidden="true"><circle r="3.8" fill="#111"><animateMotion dur="8s" begin="2s" repeatCount="indefinite" path="M 540 397 V 443"/></circle></g>
</svg>