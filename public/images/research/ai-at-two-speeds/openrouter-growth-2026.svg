<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1080" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc">
<title id="title">One platform. Growth and current volume.</title>
<desc id="desc">OpenRouter token-volume growth since February: agentic-classified traffic approximately 14 times, human-classified traffic 2.8 times. Separately, a16z&#x27;s August 21 chart ending August 7 reports nearly five times as much agentic as human token volume. Includes cached input; Mixed is separate, not a global share.</desc>
<style>text{font-family:Georgia,"Times New Roman",serif;fill:#171717} .minor{fill:#494949}</style>
<rect width="720" height="1080" fill="white"/>
<text x="48" y="45" font-size="22" font-weight="normal">SEB BUILDS  /  AI AT TWO SPEEDS  /  03</text>
<line x1="48" y1="64" x2="672" y2="64" stroke="#aaa"/>
<text x="48" y="120" font-size="40" font-weight="normal">One platform.</text>
<text x="48" y="168" font-size="40" font-weight="normal">Two rates of growth.</text>
<text x="48" y="210" font-size="27" font-weight="normal">Token-volume growth on OpenRouter</text>
<text x="48" y="245" font-size="27" font-weight="normal">About February–August 2026</text>
<text x="48" y="306" font-size="29" font-weight="normal">Agentic-classified</text>
<rect x="48" y="328" width="582.4" height="47" fill="#171717"/>
<text x="672" y="306" font-size="28" font-weight="bold" text-anchor="end">≈14×</text>
<text x="48" y="451" font-size="29" font-weight="normal">Human-classified</text>
<rect x="48" y="473" width="116.47999999999999" height="47" fill="#171717"/>
<text x="672" y="451" font-size="28" font-weight="bold" text-anchor="end">2.8×</text>
<line x1="48" y1="555" x2="672" y2="555" stroke="#aaa"/>
<line x1="48.0" y1="555" x2="48.0" y2="563" stroke="#aaa"/>
<text x="48.0" y="594" font-size="25" font-weight="normal" text-anchor="middle">0×</text>
<line x1="256.0" y1="555" x2="256.0" y2="563" stroke="#aaa"/>
<text x="256.0" y="594" font-size="25" font-weight="normal" text-anchor="middle">5×</text>
<line x1="464.0" y1="555" x2="464.0" y2="563" stroke="#aaa"/>
<text x="464.0" y="594" font-size="25" font-weight="normal" text-anchor="middle">10×</text>
<line x1="672.0" y1="555" x2="672.0" y2="563" stroke="#aaa"/>
<text x="672.0" y="594" font-size="25" font-weight="normal" text-anchor="middle">15×</text>
<text x="48" y="634" font-size="26" font-weight="normal">Each category’s own starting volume = 1×</text>
<line x1="48" y1="664" x2="672" y2="664" stroke="#aaa"/>
<text x="48" y="705" font-size="24" font-weight="normal">AUGUST VOLUME · NOT GROWTH</text>
<text x="48" y="755" font-size="40" font-weight="bold">Nearly 5× as much</text>
<text x="48" y="793" font-size="29" font-weight="normal">agentic as human token volume</text>
<text x="48" y="831" font-size="25" font-weight="normal">7-day average · Chart ends August 7, 2026</text>
