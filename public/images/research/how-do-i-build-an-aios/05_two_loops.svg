<svg xmlns="http://www.w3.org/2000/svg" class="aios-diagram" width="1080" height="1005" viewBox="0 0 1080 1005" role="img" aria-labelledby="f5-title f5-desc">
<title id="f5-title">Two connected loops</title>
<desc id="f5-desc">Proposed architecture. A slower knowledge loop ingests evidence, validates it, versions it and publishes knowledge and policy. A faster task loop retrieves, plans, acts and verifies. The published representation supports retrieval. Outcomes flow back as candidates for review before knowledge or policy promotion.</desc>
<defs><marker id="f5-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/></marker></defs>
<style>
  .aios-diagram .paper { fill:#fff; }
  .aios-diagram .ink { fill:#111; }
  .aios-diagram .line { fill:none; stroke:#111; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .aios-diagram .quiet { fill:none; stroke:#777; stroke-width:1.2; stroke-linecap:round; stroke-linejoin:round; }
  .aios-diagram .dash { stroke-dasharray:5 6; }
  .aios-diagram .node { fill:#fff; stroke:#111; stroke-width:1.6; }
  .aios-diagram .frame { fill:#fff; stroke:#777; stroke-width:1.1; }
  .aios-diagram text { fill:#111; font-family:'Liberation Serif','Times New Roman',serif; }
  .aios-diagram .title { font-size:36px; }
  .aios-diagram .subtitle { font-size:19px; fill:#555; letter-spacing:1px; }
  .aios-diagram .label { font-size:27px; }
  .aios-diagram .body { font-size:23px; }
  .aios-diagram .small { font-size:21px; fill:#444; }
  .aios-diagram .meta { font-size:18px; fill:#555; letter-spacing:.8px; }
  .aios-diagram .math { font-style:italic; }
  .aios-diagram .rule { stroke:#111; stroke-width:1.2; }
  .aios-diagram .motion { pointer-events:none; }
  @media (prefers-reduced-motion: reduce) { .aios-diagram .motion { display:none; } }
</style>
<rect width="1080" height="1005" class="paper"/>
<text x="60" y="53" class="title" text-anchor="start" ><tspan x="60" dy="0">Two connected loops</tspan></text><text x="60" y="90" class="subtitle" text-anchor="start" ><tspan x="60" dy="0">FIGURE 5  /  PROPOSED ARCHITECTURE  /  COMPILE KNOWLEDGE, EXECUTE TASKS</tspan></text><line x1="60" y1="111" x2="1020" y2="111" class="rule"/><rect x="60" y="165" width="430" height="430" rx="4" class="frame"/><rect x="590" y="165" width="430" height="430" rx="4" class="frame"/><text x="275" y="206" class="meta" text-anchor="middle" ><tspan x="275" dy="0">KNOWLEDGE LOOP</tspan></text><text x="805" y="206" class="meta" text-anchor="middle" ><tspan x="805" dy="0">EXECUTION LOOP</tspan></text><text x="275" y="235" class="small" text-anchor="middle" ><tspan x="275" dy="0">when source evidence changes</tspan></text><text x="805" y="235" class="small" text-anchor="middle" ><tspan x="805" dy="0">for each user task</tspan></text><path d="M 250 321 H 300" class="line" marker-end="url(#f5-arrow)"/><path d="M 377 367 V 455" class="line" marker-end="url(#f5-arrow)"/><path d="M 300 501 H 250" class="line" marker-end="url(#f5-arrow)"/><path d="M 172 455 V 367" class="line" marker-end="url(#f5-arrow)"/><path d="M 780 321 H 830" class="line" marker-end="url(#f5-arrow)"/><path d="M 907 367 V 455" class="line" marker-end="url(#f5-arrow)"/><path d="M 830 501 H 780" class="line" marker-end="url(#f5-arrow)"/><path d="M 702 455 V 367" class="line" marker-end="url(#f5-arrow)"/><rect x="95" y="275" width="155" height="92" rx="2" class="node"/><text x="172.5" y="330.0" class="label" text-anchor="middle" ><tspan x="172.5" dy="0">Ingest</tspan></text><rect x="300" y="275" width="155" height="92" rx="2" class="node"/><text x="377.5" y="330.0" class="label" text-anchor="middle" ><tspan x="377.5" dy="0">Validate</tspan></text><rect x="300" y="455" width="155" height="92" rx="2" class="node"/><text x="377.5" y="510.0" class="label" text-anchor="middle" ><tspan x="377.5" dy="0">Version</tspan></text><rect x="95" y="455" width="155" height="92" rx="2" class="node"/><text x="172.5" y="510.0" class="label" text-anchor="middle" ><tspan x="172.5" dy="0">Publish</tspan></text><rect x="625" y="275" width="155" height="92" rx="2" class="node"/><text x="702.5" y="330.0" class="label" text-anchor="middle" ><tspan x="702.5" dy="0">Retrieve</tspan></text><rect x="830" y="275" width="155" height="92" rx="2" class="node"/><text x="907.5" y="330.0" class="label" text-anchor="middle" ><tspan x="907.5" dy="0">Plan</tspan></text><rect x="830" y="455" width="155" height="92" rx="2" class="node"/><text x="907.5" y="510.0" class="label" text-anchor="middle" ><tspan x="907.5" dy="0">Act</tspan></text><rect x="625" y="455" width="155" height="92" rx="2" class="node"/><text x="702.5" y="510.0" class="label" text-anchor="middle" ><tspan x="702.5" dy="0">Verify</tspan></text><path d="M 172 547 V 700 H 360" class="line" marker-end="url(#f5-arrow)"/><path d="M 540 654 V 321 H 625" class="line" marker-end="url(#f5-arrow)"/><path d="M 702 547 V 630 H 960 V 845 H 740" class="line dash" marker-end="url(#f5-arrow)"/><path d="M 370 845 H 30 V 321 H 95" class="line dash" marker-end="url(#f5-arrow)"/><rect x="360" y="654" width="360" height="93" rx="2" class="node"/><text x="540.0" y="694.5" class="label" text-anchor="middle" ><tspan x="540.0" dy="0">Versioned knowledge</tspan><tspan x="540.0" dy="30">+ explicit policy</tspan></text><rect x="370" y="795" width="370" height="100" rx="2" class="node"/><text x="555.0" y="832" class="label" text-anchor="middle" ><tspan x="555.0" dy="0">Outcome → candidate</tspan></text><text x="555.0" y="865" class="small" text-anchor="middle" ><tspan x="555.0" dy="0">Review before promotion</tspan></text><text x="540" y="937" class="small" text-anchor="middle" ><tspan x="540" dy="0">Verified task outcomes are observations, not automatic policy changes.</tspan><tspan x="540" dy="29">Compilation and execution have different responsibilities and update cadences.</tspan></text><g class="motion" aria-hidden="true"><circle r="4" fill="#111"><animateMotion dur="15s" begin="0s" repeatCount="indefinite" path="M 250 321 H 300 M 377 367 V 455 M 300 501 H 250 M 172 455 V 367"/></circle></g><g class="motion" aria-hidden="true"><circle r="4" fill="#111"><animateMotion dur="7s" begin="1s" repeatCount="indefinite" path="M 780 321 H 830 M 907 367 V 455 M 830 501 H 780 M 702 455 V 367"/></circle></g><g class="motion" aria-hidden="true"><circle r="3.3" fill="#111"><animateMotion dur="15s" begin="3s" repeatCount="indefinite" path="M 702 547 V 630 H 960 V 845 H 740"/></circle></g>
</svg>
