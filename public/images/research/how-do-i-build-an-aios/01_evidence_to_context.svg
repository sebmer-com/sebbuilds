<svg xmlns="http://www.w3.org/2000/svg" class="aios-diagram" width="1080" height="815" viewBox="0 0 1080 815" role="img" aria-labelledby="f1-title f1-desc">
<title id="f1-title">From evidence to working context</title>
<desc id="f1-desc">Proposed architecture. Documentation, support, code and communication feed claim extraction and validation. Versioned Markdown modules feed a scoped index and task context. Original evidence remains separately recoverable. Execution outcomes are reviewed candidates, not automatically accepted knowledge.</desc>
<defs><marker id="f1-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/></marker></defs>
<style>
