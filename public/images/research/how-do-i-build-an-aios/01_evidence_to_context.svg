<text x="60" y="53" class="title" text-anchor="start" ><tspan x="60" dy="0">From evidence to working context</tspan></text><text x="60" y="90" class="subtitle" text-anchor="start" ><tspan x="60" dy="0">FIGURE 1  /  PROPOSED ARCHITECTURE  /  COMPILE, INDEX, RETRIEVE</tspan></text><line x1="60" y1="111" x2="1020" y2="111" class="rule"/><rect x="60" y="151" width="960" height="93" class="frame"/><text x="81" y="177" class="meta" text-anchor="start" ><tspan x="81" dy="0">SOURCE SYSTEMS</tspan></text><text x="180" y="207" class="body" text-anchor="middle" ><tspan x="180" dy="0">Documentation</tspan></text><text x="180" y="234" class="meta" text-anchor="middle" ><tspan x="180" dy="0">Confluence · files</tspan></text><line x1="300" y1="169" x2="300" y2="229" class="quiet"/><text x="420" y="207" class="body" text-anchor="middle" ><tspan x="420" dy="0">Support</tspan></text><text x="420" y="234" class="meta" text-anchor="middle" ><tspan x="420" dy="0">Cases · resolutions</tspan></text><line x1="540" y1="169" x2="540" y2="229" class="quiet"/><text x="660" y="207" class="body" text-anchor="middle" ><tspan x="660" dy="0">Code</tspan></text><text x="660" y="234" class="meta" text-anchor="middle" ><tspan x="660" dy="0">Repositories · changes</tspan></text><line x1="780" y1="169" x2="780" y2="229" class="quiet"/><text x="900" y="207" class="body" text-anchor="middle" ><tspan x="900" dy="0">Communication</tspan></text><text x="900" y="234" class="meta" text-anchor="middle" ><tspan x="900" dy="0">Teams · discussions</tspan></text><path d="M 195 244 V 310" class="line" marker-end="url(#f1-arrow)"/><path d="M 330 363 H 405" class="line" marker-end="url(#f1-arrow)"/><path d="M 675 363 H 750" class="line" marker-end="url(#f1-arrow)"/><path d="M 885 416 V 459 H 540 V 500" class="line" marker-end="url(#f1-arrow)"/><path d="M 675 553 H 750" class="line" marker-end="url(#f1-arrow)"/><path d="M 75 244 H 31 V 553 H 60" class="quiet" marker-end="url(#f1-arrow)"/><path d="M 195 606 V 680 H 885 V 606" class="line dash" marker-end="url(#f1-arrow)"/><rect x="60" y="310" width="270" height="106" rx="2" class="node"/><text x="195.0" y="357.0" class="label" text-anchor="middle" ><tspan x="195.0" dy="0">Extract candidate</tspan><tspan x="195.0" dy="30">claims</tspan></text><rect x="405" y="310" width="270" height="106" rx="2" class="node"/><text x="540.0" y="357.0" class="label" text-anchor="middle" ><tspan x="540.0" dy="0">Validate meaning</tspan><tspan x="540.0" dy="30">+ provenance</tspan></text><rect x="750" y="310" width="270" height="106" rx="2" class="node"/><text x="885.0" y="357.0" class="label" text-anchor="middle" ><tspan x="885.0" dy="0">Version Markdown</tspan><tspan x="885.0" dy="30">modules</tspan></text><rect x="60" y="500" width="270" height="106" rx="2" class="node"/><text x="195.0" y="547.0" class="label" text-anchor="middle" ><tspan x="195.0" dy="0">Retained source</tspan><tspan x="195.0" dy="30">evidence</tspan></text><rect x="405" y="500" width="270" height="106" rx="2" class="node"/><text x="540.0" y="547.0" class="label" text-anchor="middle" ><tspan x="540.0" dy="0">Scoped index</tspan><tspan x="540.0" dy="30">+ retrieval rules</tspan></text><rect x="750" y="500" width="270" height="106" rx="2" class="node"/><text x="885.0" y="547.0" class="label" text-anchor="middle" ><tspan x="885.0" dy="0">Task-specific</tspan><tspan x="885.0" dy="30">working context</tspan></text><text x="540" y="660" class="small" text-anchor="middle" ><tspan x="540" dy="0">Recover exact evidence when detail matters</tspan></text><text x="60" y="746" class="small" text-anchor="start" ><tspan x="60" dy="0">Execution outcomes return as evidence candidates for review.</tspan><tspan x="60" dy="29">Source retention, active knowledge and runtime context have distinct responsibilities.</tspan></text><g class="motion" aria-hidden="true"><circle r="4" fill="#111"><animateMotion dur="6s" begin="0s" repeatCount="indefinite" path="M 195 244 V 310"/></circle></g><g class="motion" aria-hidden="true"><circle r="4" fill="#111"><animateMotion dur="8s" begin="1s" repeatCount="indefinite" path="M 330 363 H 405 M 675 363 H 750"/></circle></g><g class="motion" aria-hidden="true"><circle r="4" fill="#111"><animateMotion dur="7s" begin="2s" repeatCount="indefinite" path="M 675 553 H 750"/></circle></g>
