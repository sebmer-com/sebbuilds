<svg xmlns="http://www.w3.org/2000/svg" class="aios-diagram" width="1080" height="851" viewBox="0 0 1080 851" role="img" aria-labelledby="f3-title f3-desc">
<title id="f3-title">Three representations of the same knowledge</title>
<desc id="f3-desc">Proposed architecture. An illustrative conditional rule appears as source evidence, a concise canonical record preserving condition, action, exception and provenance, and a query-specific packet under a context budget. Exact source detail remains recoverable. The diagram does not claim lossless compression.</desc>
<defs><marker id="f3-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/></marker></defs>
<style>
  .aios-diagram .paper { fill:#fff; }
  .aios-diagram .ink { fill:#111; }
  .aios-diagram .line { fill:none; stroke:#111; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .aios-diagram .quiet { fill:none; stroke:#777; stroke-width:1.2; stroke-linecap:round; stroke-linejoin:round; }
  .aios-diagram .dash { stroke-dasharray:5 6; }
  .aios-diagram .node { fill:#fff; stroke:#111; stroke-width:1.6; }
  .aios-diagram .frame { fill:#fff; stroke:#777; stroke-width:1.1; }
  .aios-diagram text { fill:#111; font-family:'Liberation Serif','Times New Roman',serif; }
  .aios-diagram .title { font-size:36px; }
  .aios-diagram .subtitle { font-size:19px; fill:#555; letter-spacing:1px; }
  .aios-diagram .label { font-size:27px; }
  .aios-diagram .body { font-size:23px; }
  .aios-diagram .small { font-size:21px; fill:#444; }
  .aios-diagram .meta { font-size:18px; fill:#555; letter-spacing:.8px; }
  .aios-diagram .math { font-style:italic; }
  .aios-diagram .rule { stroke:#111; stroke-width:1.2; }
  .aios-diagram .motion { pointer-events:none; }
  @media (prefers-reduced-motion: reduce) { .aios-diagram .motion { display:none; } }
</style>
<rect width="1080" height="851" class="paper"/>
<text x="60" y="53" class="title" text-anchor="start" ><tspan x="60" dy="0">Three representations of the same knowledge</tspan></text><text x="60" y="90" class="subtitle" text-anchor="start" ><tspan x="60" dy="0">FIGURE 3  /  PROPOSED ARCHITECTURE  /  COMPRESSION WITH RECOVERY</tspan></text><line x1="60" y1="111" x2="1020" y2="111" class="rule"/><rect x="60" y="183" width="280" height="457" class="node"/><text x="200" y="227" class="label math" text-anchor="middle" ><tspan x="200" dy="0">I</tspan></text><text x="200" y="271" class="label" text-anchor="middle" ><tspan x="200" dy="0">Source evidence</tspan></text><line x1="84" y1="299" x2="316" y2="299" class="quiet"/><rect x="400" y="183" width="280" height="457" class="node"/><text x="540" y="227" class="label math" text-anchor="middle" ><tspan x="540" dy="0">II</tspan></text><text x="540" y="271" class="label" text-anchor="middle" ><tspan x="540" dy="0">Canonical record</tspan></text><line x1="424" y1="299" x2="656" y2="299" class="quiet"/><rect x="740" y="183" width="280" height="457" class="node"/><text x="880" y="227" class="label math" text-anchor="middle" ><tspan x="880" dy="0">III</tspan></text><text x="880" y="271" class="label" text-anchor="middle" ><tspan x="880" dy="0">Task packet</tspan></text><line x1="764" y1="299" x2="996" y2="299" class="quiet"/><text x="85" y="341" class="body" text-anchor="start" ><tspan x="85" dy="0">When C applies,</tspan><tspan x="85" dy="35">perform A,</tspan><tspan x="85" dy="35">unless E holds.</tspan><tspan x="85" dy="35"></tspan><tspan x="85" dy="35">Source S, version V,</tspan><tspan x="85" dy="35">location L.</tspan></text><text x="85" y="601" class="small" text-anchor="start" ><tspan x="85" dy="0">Full detail retained</tspan></text><text x="425" y="341" class="body" text-anchor="start" ><tspan x="425" dy="0">condition: C</tspan><tspan x="425" dy="43">action: A</tspan><tspan x="425" dy="43">exception: E</tspan><tspan x="425" dy="43">source: S @ V : L</tspan></text><text x="425" y="552" class="small" text-anchor="start" ><tspan x="425" dy="0">Explicit meaning,</tspan><tspan x="425" dy="29">less repetition</tspan></text><text x="765" y="341" class="body" text-anchor="start" ><tspan x="765" dy="0">Task q + scope</tspan><tspan x="765" dy="43">Condition C</tspan><tspan x="765" dy="43">Action A, except E</tspan><tspan x="765" dy="43">Evidence S @ V : L</tspan></text><text x="765" y="552" class="small" text-anchor="start" ><tspan x="765" dy="0">Bounded by the task</tspan><tspan x="765" dy="29">and context budget B</tspan></text><path d="M 340 415 H 400" class="line" marker-end="url(#f3-arrow)"/><path d="M 680 415 H 740" class="line" marker-end="url(#f3-arrow)"/><text x="370" y="158" class="small" text-anchor="middle" ><tspan x="370" dy="0">compile</tspan></text><text x="710" y="158" class="small" text-anchor="middle" ><tspan x="710" dy="0">select</tspan></text><path d="M 880 640 V 718 H 200 V 640" class="line dash" marker-end="url(#f3-arrow)"/><text x="540" y="699" class="small" text-anchor="middle" ><tspan x="540" dy="0">Recover source detail when exactness is required</tspan></text><text x="60" y="781" class="small" text-anchor="start" ><tspan x="60" dy="0">Compression is task dependent. A shorter representation is not proof of losslessness.</tspan><tspan x="60" dy="29">C, A, E, S, V and L are symbolic placeholders, not an operational policy.</tspan></text><g class="motion" aria-hidden="true"><circle r="4" fill="#111"><animateMotion dur="6s" begin="0s" repeatCount="indefinite" path="M 340 415 H 400"/></circle></g><g class="motion" aria-hidden="true"><circle r="4" fill="#111"><animateMotion dur="6s" begin="2s" repeatCount="indefinite" path="M 680 415 H 740"/></circle></g><g class="motion" aria-hidden="true"><circle r="3.4" fill="#111"><animateMotion dur="13s" begin="1s" repeatCount="indefinite" path="M 880 640 V 718 H 200 V 640"/></circle></g>
</svg>
