<svg xmlns="http://www.w3.org/2000/svg" class="aios-diagram" width="1080" height="857" viewBox="0 0 1080 857" role="img" aria-labelledby="f2-title f2-desc">
<title id="f2-title">A claim has a history</title>
<desc id="f2-desc">Proposed architecture. An append-only sequence of source observations and revisions is distinct from a query-time active view. Claims can be valid, superseded or disputed depending on authority, effective time and scope. Retaining semantic lineage does not override privacy-driven redaction or erasure.</desc>
<defs><marker id="f2-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/></marker></defs>
<style>
  .aios-diagram .paper { fill:#fff; }
  .aios-diagram .ink { fill:#111; }
  .aios-diagram .line { fill:none; stroke:#111; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .aios-diagram .quiet { fill:none; stroke:#777; stroke-width:1.2; stroke-linecap:round; stroke-linejoin:round; }
  .aios-diagram .dash { stroke-dasharray:5 6; }
  .aios-diagram .node { fill:#fff; stroke:#111; stroke-width:1.6; }
  .aios-diagram .frame { fill:#fff; stroke:#777; stroke-width:1.1; }
  .aios-diagram text { fill:#111; font-family:'Liberation Serif','Times New Roman',serif; }
  .aios-diagram .title { font-size:36px; }
  .aios-diagram .subtitle { font-size:19px; fill:#555; letter-spacing:1px; }
  .aios-diagram .label { font-size:27px; }
  .aios-diagram .body { font-size:23px; }
  .aios-diagram .small { font-size:21px; fill:#444; }
  .aios-diagram .meta { font-size:18px; fill:#555; letter-spacing:.8px; }
  .aios-diagram .math { font-style:italic; }
  .aios-diagram .rule { stroke:#111; stroke-width:1.2; }
  .aios-diagram .motion { pointer-events:none; }
  @media (prefers-reduced-motion: reduce) { .aios-diagram .motion { display:none; } }
</style>
<rect width="1080" height="857" class="paper"/>
<text x="60" y="53" class="title" text-anchor="start" ><tspan x="60" dy="0">A claim has a history</tspan></text><text x="60" y="90" class="subtitle" text-anchor="start" ><tspan x="60" dy="0">FIGURE 2  /  PROPOSED ARCHITECTURE  /  LINEAGE AND CURRENT VALIDITY</tspan></text><line x1="60" y1="111" x2="1020" y2="111" class="rule"/><text x="60" y="163" class="body" text-anchor="start" ><tspan x="60" dy="0">Append observations and revisions; retain their relationships.</tspan></text><rect x="60" y="207" width="280" height="165" rx="2" class="node"/><text x="200.0" y="244" class="label" text-anchor="middle" ><tspan x="200.0" dy="0">Observation v₁</tspan></text><text x="200.0" y="277" class="small" text-anchor="middle" ><tspan x="200.0" dy="0">Initial assertion</tspan><tspan x="200.0" dy="26">Source anchor + time</tspan></text><text x="200" y="349" class="meta" text-anchor="middle" ><tspan x="200" dy="0">claim + provenance</tspan></text><path d="M 340 289 H 400" class="line" marker-end="url(#f2-arrow)"/><rect x="400" y="207" width="280" height="165" rx="2" class="node"/><text x="540.0" y="244" class="label" text-anchor="middle" ><tspan x="540.0" dy="0">Observation v₂</tspan></text><text x="540.0" y="277" class="small" text-anchor="middle" ><tspan x="540.0" dy="0">Revision or replacement</tspan><tspan x="540.0" dy="26">Source anchor + time</tspan></text><text x="540" y="349" class="meta" text-anchor="middle" ><tspan x="540" dy="0">claim + provenance</tspan></text><path d="M 680 289 H 740" class="line" marker-end="url(#f2-arrow)"/><rect x="740" y="207" width="280" height="165" rx="2" class="node"/><text x="880.0" y="244" class="label" text-anchor="middle" ><tspan x="880.0" dy="0">Observation v₃</tspan></text><text x="880.0" y="277" class="small" text-anchor="middle" ><tspan x="880.0" dy="0">Supporting or conflicting</tspan><tspan x="880.0" dy="26">Source anchor + time</tspan></text><text x="880" y="349" class="meta" text-anchor="middle" ><tspan x="880" dy="0">claim + provenance</tspan></text><path d="M 200 372 V 390 H 920 V 473" class="line" marker-end="url(#f2-arrow)"/><path d="M 540 372 V 390" class="line"/><path d="M 880 372 V 390" class="line"/><text x="60" y="419" class="small" text-anchor="start" ><tspan x="60" dy="0">Resolve the active view using:</tspan></text><text x="60" y="450" class="body" text-anchor="start" ><tspan x="60" dy="0">authority · effective time · scope · conflicts</tspan></text><rect x="60" y="493" width="960" height="186" class="node"/><text x="540" y="527" class="meta" text-anchor="middle" ><tspan x="540" dy="0">QUERY-TIME STATUS</tspan></text><text x="220" y="575" class="label" text-anchor="middle" ><tspan x="220" dy="0">VALID</tspan></text><text x="220" y="613" class="small" text-anchor="middle" ><tspan x="220" dy="0">Eligible for the task</tspan><tspan x="220" dy="27">within its stated scope</tspan></text><text x="540" y="575" class="label" text-anchor="middle" ><tspan x="540" dy="0">SUPERSEDED</tspan></text><text x="540" y="613" class="small" text-anchor="middle" ><tspan x="540" dy="0">Preserved in history</tspan><tspan x="540" dy="27">excluded by default</tspan></text><text x="860" y="575" class="label" text-anchor="middle" ><tspan x="860" dy="0">DISPUTED</tspan></text><text x="860" y="613" class="small" text-anchor="middle" ><tspan x="860" dy="0">Conflict remains visible</tspan><tspan x="860" dy="27">resolve before reliance</tspan></text><line x1="380" y1="549" x2="380" y2="655" class="quiet"/><line x1="700" y1="549" x2="700" y2="655" class="quiet"/><rect x="60" y="727" width="960" height="91" class="frame"/><text x="82" y="761" class="small" text-anchor="start" ><tspan x="82" dy="0">Preserve semantic lineage. Retention is a separate policy.</tspan><tspan x="82" dy="29">Privacy removal may require redaction or erasure of retained records.</tspan></text><g class="motion" aria-hidden="true"><circle r="4" fill="#111"><animateMotion dur="7s" begin="0s" repeatCount="indefinite" path="M 340 289 H 400"/></circle></g><g class="motion" aria-hidden="true"><circle r="4" fill="#111"><animateMotion dur="7s" begin="2s" repeatCount="indefinite" path="M 680 289 H 740"/></circle></g><g class="motion" aria-hidden="true"><circle r="4" fill="#111"><animateMotion dur="9s" begin="1s" repeatCount="indefinite" path="M 200 372 V 390 H 920 V 473"/></circle></g>
</svg>
